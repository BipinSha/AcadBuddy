name: Build AcadBuddy

on:
  push:
    branches: [redesign, main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: acadbuddy-site
          path: _site
          if-no-files-found: error
          retention-days: 7
